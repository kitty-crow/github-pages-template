name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install project
        run: bun install
      - name: Check pages
        run: bun __TEMPLATE__/src/cli.ts check pages.config.ts
      - name: Build pages
        run: bun __TEMPLATE__/src/cli.ts build pages.config.ts
      - name: Install mobile audit browser
        run: |
          cd "__TEMPLATE__"
          bun install
          bunx playwright install --with-deps chromium
      - name: Audit mobile responsiveness
        run: bun __TEMPLATE__/src/cli.ts audit-mobile site
